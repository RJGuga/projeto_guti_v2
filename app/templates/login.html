﻿﻿<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – QAQ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px;">

    <a href="{{ url_for('main.home') }}" style="margin-bottom:24px;">
        <img src="{{ url_for('static', filename='logo.jpg') }}" style="height:140px; width:auto;" alt="QAQ">
    </a>

    <div class="qaq-card" style="width:100%; max-width:420px;">
        <h2 style="text-align:center; color:#08480C; margin-bottom:24px;">🔐 Entrar na conta</h2>
        <form id="loginForm" class="qaq-form" method="post">
            <input type="hidden" name="next" value="{{ next }}">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
            <input type="submit" value="Entrar">
        </form>
        <p style="text-align:center; margin-top:16px; font-size:0.88rem; color:#666;">
            Não tem conta? <a href="{{ url_for('auth.cadastro', next=next) }}" class="qaq-link">Cadastre-se gratuitamente</a>
        </p>
    </div>

<script>
$('#loginForm').submit(function(e) {
    e.preventDefault();
    $.ajax({
        url: "{{ url_for('auth.login') }}",
        method: "POST",
        data: { email: $('#email').val(), senha: $('#senha').val() },
        success: function(r) {
            if (r.status === 'sucesso') {
                Swal.fire({ icon:'success', title:'Bem-vindo!', showConfirmButton:false, timer:1500 })
                    .then(function() {
                        window.location.href = (r.next && r.next.trim() !== '') ? r.next : '{{ url_for("main.home") }}';
                    });
            } else if (r.mensagem === 'credenciais_invalidas') {
                Swal.fire({ icon:'error', title:'Senha incorreta', text:'Verifique sua senha e tente novamente.' });
            } else {
                Swal.fire({ icon:'error', title:'E-mail não cadastrado', text:'Realize seu cadastro primeiro.' });
            }
        },
        error: function() {
            Swal.fire({ icon:'error', title:'Erro', text:'Não foi possível processar o login.' });
        }
    });
});
</script>
</body>
</html>
