<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Sala – QAQ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="qaq-navbar">
    <a href="{{ url_for('main.home') }}">
        <img src="{{ url_for('static', filename='logo.jpg') }}" class="logo" alt="QAQ">
    </a>
    <div class="nav-links">
        <span class="welcome">Olá, {{ nome_criador }}!</span>
        <a href="{{ url_for('main.home') }}" class="btn-qaq">Home</a>
        <a href="{{ url_for('salas.salas_criadas') }}" class="btn-qaq">Minhas salas</a>
        <a href="{{ url_for('auth.sair') }}" class="btn-qaq danger">Sair</a>
    </div>
</nav>

<div class="page-wrapper" style="max-width:540px;">
    <h1 class="page-title">🏟️ Criar nova sala</h1>

    <!-- PASSO 1: Preenchimento dos dados -->
    <div id="step-1" class="qaq-card">
        <form id="form-sala" action="/sala" method="POST" class="qaq-form">

            <label for="nome_sala">Nome da sala</label>
            <input type="text" id="nome_sala" name="nome_sala" placeholder="Ex: Clássico do Sábado" required>

            <label for="valor">Valor da aposta (R$)</label>
            <input type="number" id="valor" name="valor" placeholder="Ex: 50" min="1" required>

            <label>Times</label>
            <div style="display:flex; gap:12px; align-items:center; margin-bottom:16px;">
                <input type="text" id="time1" name="time1" placeholder="Time 1" required style="margin-bottom:0;">
                <span style="font-weight:900; font-size:1.2rem; color:#08480C;">X</span>
                <input type="text" id="time2" name="time2" placeholder="Time 2" required style="margin-bottom:0;">
            </div>

            <button type="button" id="btn-avancar" class="btn-qaq green" style="width:100%; padding:12px; font-size:1rem;">
                Avançar ›
            </button>
        </form>
    </div>

    <!-- PASSO 2: Confirmação dos dados -->
    <div id="step-2" class="qaq-card" style="display:none;">
        <h2 class="card-title">✅ Confirmar abertura da sala</h2>

        <table style="width:100%; border-collapse:collapse; margin-bottom:24px;">
            <tr>
                <td style="padding:10px 0; color:#555; font-weight:600;">Nome da sala</td>
                <td id="conf-nome" style="padding:10px 0; font-weight:700; color:#08480C;"></td>
            </tr>
            <tr style="border-top:1px solid #eee;">
                <td style="padding:10px 0; color:#555; font-weight:600;">Valor da aposta</td>
                <td id="conf-valor" style="padding:10px 0; font-weight:700; color:#08480C;"></td>
            </tr>
            <tr style="border-top:1px solid #eee;">
                <td style="padding:10px 0; color:#555; font-weight:600;">Times</td>
                <td id="conf-times" style="padding:10px 0; font-weight:700; color:#08480C;"></td>
            </tr>
        </table>

        <div style="display:flex; gap:12px;">
            <button id="btn-ajustar" class="btn-qaq" style="flex:1; padding:12px; font-size:1rem;">
                ‹ Ajustar
            </button>
            <button id="btn-confirmar" class="btn-qaq green" style="flex:1; padding:12px; font-size:1rem;">
                ✔ Confirmar
            </button>
        </div>
    </div>
</div>

<script>
(function () {
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const form  = document.getElementById('form-sala');

    document.getElementById('btn-avancar').addEventListener('click', function () {
        // Dispara validação nativa do browser
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }
        // Preenche o resumo
        const nome  = document.getElementById('nome_sala').value.trim();
        const valor = document.getElementById('valor').value;
        const t1    = document.getElementById('time1').value.trim();
        const t2    = document.getElementById('time2').value.trim();

        document.getElementById('conf-nome').textContent  = nome;
        document.getElementById('conf-valor').textContent = 'R$ ' + valor;
        document.getElementById('conf-times').textContent = t1 + '  ×  ' + t2;

        step1.style.display = 'none';
        step2.style.display = 'block';
    });

    document.getElementById('btn-ajustar').addEventListener('click', function () {
        step2.style.display = 'none';
        step1.style.display = 'block';
        document.getElementById('nome_sala').focus();
    });

    document.getElementById('btn-confirmar').addEventListener('click', function () {
        form.submit();
    });

    // Atalho: ESC no passo 2 volta ao passo 1
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && step2.style.display === 'block') {
            document.getElementById('btn-ajustar').click();
        }
    });
}());
</script>

</body>
</html>
