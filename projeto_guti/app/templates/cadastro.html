﻿<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro – QAQ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px;">

    <a href="{{ url_for('main.home') }}" style="margin-bottom:24px;">
        <img src="{{ url_for('static', filename='logo.jpg') }}" style="height:140px; width:auto;" alt="QAQ">
    </a>

    <div class="qaq-card" style="width:100%; max-width:460px;">
        <h2 style="text-align:center; color:#08480C; margin-bottom:24px;">📝 Criar conta</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('auth.cadastro') }}" method="post" class="qaq-form" onsubmit="return validarSenha();">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required>

            <label for="confirmar_senha">Confirmar senha</label>
            <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a senha" required>

            <input type="submit" value="Criar conta">
        </form>
        <p style="text-align:center; margin-top:16px; font-size:0.88rem; color:#666;">
            Já tem conta? <a href="{{ url_for('auth.login') }}" class="qaq-link">Fazer login</a>
        </p>
    </div>

<script>
function validarSenha() {
    var s = document.getElementById('senha').value;
    var c = document.getElementById('confirmar_senha').value;
    if (s !== c) {
        Swal.fire({ icon:'error', title:'Senhas não conferem', text:'A senha e a confirmação devem ser iguais.' });
        return false;
    }
    return true;
}
</script>
</body>
</html>
